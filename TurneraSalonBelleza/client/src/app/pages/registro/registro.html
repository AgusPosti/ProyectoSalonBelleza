<div class="registro-overlay">

  <div class="registro-modal">

    <button class="registro-close" type="button" (click)="cerrarRegistro()">×</button>

    <h2>Crear cuenta</h2>

    <p>Registrate para reservar tu turno ♡</p>

    <label>Nombre</label>
    <input type="text" placeholder="Tu nombre">

    <label>Correo electrónico</label>
    <input type="email" placeholder="Tu correo">

    <label>Contraseña</label>
    <input type="password" placeholder="Tu contraseña">

    <label>Repetir contraseña</label>
    <input type="password" placeholder="Repetí tu contraseña">

    <button type="button" class="registro-btn">
      Crear cuenta
    </button>

    <p class="login-text">
      ¿Ya tenés una cuenta?
      <button type="button" class="login-link" (click)="abrirLogin()">Iniciar sesión</button>
    </p>

  </div>

</div>
